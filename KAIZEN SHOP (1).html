<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KAIZEN SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Kanit:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top nav, single column max 1120px; admin = side menu (tab strip on phones). One dark world: black / violet / white. */
:root{
  --bg:#0a0810; --surface:#141020; --surface2:#1d1730; --line:#2e2547;
  --fg:#f5f2fc; --muted:#a99fc2; --accent:#8b5cf6; --accent-hi:#c4a8ff; --accent-ink:#ffffff;
  --ok:#3ddc97; --warn:#f5c542; --bad:#ff5d6c;
  --f-display:'Kanit','Anuphan',system-ui,sans-serif; --f-body:'Anuphan','Noto Sans Thai',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:700;letter-spacing:.01em}
h2{font-size:1.6rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
a{color:var(--accent-hi)}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:16px}
.mono{font-family:var(--f-mono);letter-spacing:.02em}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.nw{flex-wrap:nowrap}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.two>*,.grid>*,.row>*{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,8,16,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--fg);cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.06em;padding:0}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#8b5cf6,#4c1d95);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav button{background:none;border:0;color:var(--muted);font:inherit;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--fg);background:var(--surface)}
.nav button.on{color:var(--fg);background:var(--surface2);box-shadow:inset 0 -2px 0 var(--accent)}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;cursor:pointer;transition:transform .12s,background .12s}
.btn:hover{background:#9f78ff;transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);background:var(--surface)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06210f}
.btn{white-space:nowrap}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}
input,select,textarea{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px}
input[type=file]{padding:8px}
input[type=checkbox]{width:auto}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.form .full{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.glow{border-color:#4b3a7a;box-shadow:0 0 0 1px rgba(139,92,246,.15),0 18px 50px -24px rgba(139,92,246,.6)}
.sec{padding-block:36px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-hi);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;padding:3px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--fg);white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;color:var(--muted)}
.price{font-family:var(--f-display);font-weight:600;font-size:1.5rem}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:-30% -10% auto -10%;height:120%;background:radial-gradient(40% 50% at 20% 30%,rgba(139,92,246,.42),transparent 70%),radial-gradient(35% 45% at 80% 20%,rgba(76,29,149,.55),transparent 70%);animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
.hero .wrap{position:relative;padding-block:64px 52px;display:flex;flex-direction:column;gap:20px}
.hero p.lead{max-width:56ch;color:#d6cdea;font-size:1.05rem}
@keyframes drift{to{transform:translate3d(4%,6%,0) scale(1.08)}}
.work{padding:0;overflow:hidden;display:flex;flex-direction:column}
.work .thumb{aspect-ratio:16/10;max-width:100%;display:flex;align-items:flex-end;padding:12px;font-family:var(--f-display);font-weight:600;font-size:1.05rem;position:relative}
.work .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.work .thumb span{position:relative;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.work .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:.8rem;letter-spacing:.04em;background:var(--surface)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface)}
tr.me{background:rgba(139,92,246,.14)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.admin{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding-block:24px}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start}
.side button{text-align:left;background:none;border:0;color:var(--muted);font:inherit;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.side button:hover{background:var(--surface);color:var(--fg)}
.side button.on{background:var(--surface2);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.dot{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--bad);color:#fff;font-size:.72rem;padding-inline:6px}
@media (max-width:860px){
  .admin{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .side button{white-space:nowrap}
}
.chat{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding:4px}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;background:var(--surface2);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:#3b2a73}
.msg small{display:block;color:var(--muted);font-size:.72rem}
.slip{max-width:260px;width:100%;border-radius:10px;border:1px solid var(--line);display:block;background:var(--bg);min-height:60px}
.ph{display:grid;place-items:center;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted);padding:20px;font-size:.85rem}
.qr{width:200px;max-width:100%;aspect-ratio:1;border-radius:12px;background:#fff;display:block;object-fit:contain}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--surface2);border:1px solid var(--accent);padding:10px 18px;border-radius:12px;z-index:50;max-width:92vw}
.notice{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.88rem;color:var(--muted)}
.notice.warn{border-color:var(--warn);color:var(--fg)}
.notice.bad{border-color:var(--bad);color:var(--fg)}
.notice.ok{border-color:var(--ok);color:var(--fg)}
.pts{font-family:var(--f-display);font-size:3rem;font-weight:700;color:var(--accent-hi)}
.foot{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:.88rem}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.6)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.steps li{flex:1 1 100px;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted)}
.steps li b{height:6px;border-radius:99px;background:var(--line);display:block}
.steps li.done b{background:var(--accent)}
.steps li.now b{background:var(--accent-hi);box-shadow:0 0 12px rgba(196,168,255,.7)}
.steps li.now{color:var(--fg);font-weight:600}
.bigpos{font-family:var(--f-display);font-size:3.2rem;font-weight:700;line-height:1;color:var(--accent-hi)}
.ordno{font-family:var(--f-mono);font-size:1.4rem;letter-spacing:.04em;overflow-wrap:anywhere}
pre.mono{white-space:pre-wrap;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.hero::before,.live i{animation:none}.btn{transition:none}}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const baht=n=>Number(n||0).toLocaleString('th-TH')+' บาท';
const fmtDT=t=>t?new Date(t).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'-';
const fmtD=t=>t?new Date(t).toLocaleDateString('th-TH',{dateStyle:'medium'}):'-';
const clone=x=>x==null?x:JSON.parse(JSON.stringify(x));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fd=f=>{const o={};new FormData(f).forEach((v,k)=>{if(typeof v==='string')o[k]=v});return o};
function merge(a,p){const r=Object.assign({},a);Object.keys(p).forEach(k=>{const v=p[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&a&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))r[k]=merge(a[k],v);else r[k]=v});return r}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const safeImg=s=>typeof s==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(s)?s:'';
const safeLink=s=>/^https?:\/\//i.test(s||'')?s:'';

const STATUS={unpaid:['รอชำระเงิน','#f5c542'],review:['รอตรวจสอบสลิป','#ff9a3c'],working:['กำลังดำเนินการ','#4aa3ff'],check:['รอตรวจงาน','#b27cff'],done:['เสร็จสิ้น','#3ddc97'],cancel:['ยกเลิก','#ff5d6c']};
const STEPS=['unpaid','review','working','check','done'];
const SPEED={1:{label:'ปกติ · 1-2 วัน',mult:1,short:'ปกติ'},2:{label:'เร็ว x2 · ส่งภายใน 1 วัน',mult:2,short:'x2'},3:{label:'ด่วน x3 · เริ่มทำทันที',mult:3,short:'x3'}};
const badge=s=>{const t=STATUS[s]||STATUS.unpaid;return '<span class="badge" style="--c:'+t[1]+'">'+t[0]+'</span>'};

/* ---------- state ---------- */
const D={cfg:null,media:null,works:[],track:[],my:null,mys:null,orders:{},states:{},audit:null,ready:false,loaded:{},err:{},noDb:false,noRuntime:false};
const ID={uid:null,admin:false,name:''};
let DB=null,UA=null,DL=null,V={name:'home'},dirty=false,pdown=false;
const IMG={},LOAD={},WQ={};

const ST=()=>{const s=(D.cfg&&D.cfg.settings)||{};return{shopName:s.shopName||'KAIZEN SHOP',tagline:s.tagline||'',about:s.about||'',contact:s.contact||{},rate:s.rate||{baht:10,points:1},bank:s.bank||{}}};
const cats=()=>(D.cfg&&D.cfg.cats)||[];
const pkgs=()=>(D.cfg&&D.cfg.pkgs)||[];
const rewards=()=>(D.cfg&&D.cfg.rewards)||[];
const catName=id=>{const c=cats().find(x=>x.id===id);return c?c.name:'-'};
const priceTxt=n=>n>0?baht(n):'สอบถามราคา';

function wq(key,fn){const prev=WQ[key]||Promise.resolve();const p=prev.catch(()=>{}).then(fn);WQ[key]=p.catch(()=>{});return p}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},3200)}
function fail(e){const c=e&&e.code;toast(c==='quota_exceeded'?'พื้นที่เก็บข้อมูลเต็ม แจ้งแอดมินให้ลบข้อมูลเก่า':c==='invalid_argument'?'บัญชีนี้ยังไม่มีสิทธิ์บันทึก ให้แอดมินเชิญเป็น Contributor':c==='busy'?'ระบบกำลังออกเลขออเดอร์ให้คนอื่น กรุณากดอีกครั้ง':c==='resource_exhausted'?'ทำรายการถี่เกินไป รอสักครู่แล้วลองใหม่':'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');return false}
async function run(p){try{await p;return true}catch(e){return fail(e)}}

/* ---------- data access ---------- */
const getM=u=>(u===ID.uid&&D.my)||D.orders[u]||null;
const getS=u=>(u===ID.uid&&D.mys)||D.states[u]||null;
function entries(u){const m=getM(u)||{},s=getS(u)||{},ss=s.states||{};return Object.keys(m.orders||{}).map(oid=>({oid,uid:u,o:m.orders[oid],st:ss[oid],m,s}))}
const byNew=(a,b)=>(b.o.at||0)-(a.o.at||0);
const myEntries=()=>ID.uid?entries(ID.uid).sort(byNew):[];
function allEntries(){const seen={};let r=[];Object.keys(D.orders).forEach(u=>{seen[u]=1;r=r.concat(entries(u))});if(ID.uid&&!seen[ID.uid])r=r.concat(entries(ID.uid));return r.sort(byNew)}
function eff(x){const st=x.st||{};const s=st.status||'unpaid';if(s==='unpaid'){const l=(x.o.slips||[]).slice(-1)[0];if(l&&l.at>(st.reviewedAt||0))return 'review'}return s}
const total=x=>x.st&&x.st.total!=null?x.st.total:(x.o.total||0);
function balance(u){const m=getM(u)||{},s=getS(u)||{};let earned=0,adj=0,spent=0;(s.ledger||[]).forEach(l=>{adj+=l.delta;if(l.delta>0)earned+=l.delta});Object.keys(m.redeems||{}).forEach(k=>{spent+=m.redeems[k].pts||0});return{bal:adj-spent,earned,spent}}
function coupons(u){const m=getM(u)||{},r=m.redeems||{},es=entries(u);return Object.keys(r).map(k=>Object.assign({id:k},r[k],{used:es.some(x=>x.o.couponId===k&&eff(x)!=='cancel')})).sort((a,b)=>b.at-a.at)}
function queueList(){return D.track.filter(t=>t.status==='working').sort((a,b)=>(b.tier||1)-(a.tier||1)||(a.queueAt||0)-(b.queueAt||0))}
function posOf(no){const q=queueList(),i=q.findIndex(t=>t.no===no);return i<0?null:{pos:i+1,of:q.length}}
function etaText(speed,at){if(!at)return '';if(speed===3)return 'เริ่มทำทันทีหลังอนุมัติการชำระเงิน';return 'ภายใน '+fmtDT(at+(speed===2?1:2)*864e5)}
const maskName=n=>String(n||'ลูกค้า').trim().slice(0,1)+'***';
const unreadCust=()=>{const seen=Number(lsGet('kz-seen-'+ID.uid)||0);return((D.mys&&D.mys.notifs)||[]).filter(n=>n.at>seen).length};
function adminFeed(){
  const ev=[];
  allEntries().forEach(x=>{
    const n=(x.m&&x.m.name)||'ลูกค้า';
    ev.push({at:x.o.at,text:n+' สั่งออเดอร์ '+x.o.no,oid:x.oid,uid:x.uid});
    (x.o.slips||[]).forEach(s=>ev.push({at:s.at,text:n+' แนบสลิปออเดอร์ '+x.o.no+' ('+baht(s.amount)+')',oid:x.oid,uid:x.uid}));
    (x.o.msgs||[]).forEach(m=>ev.push({at:m.at,text:n+' ส่งข้อความในออเดอร์ '+x.o.no,oid:x.oid,uid:x.uid}));
    if(x.o.ackAt)ev.push({at:x.o.ackAt,text:n+' ยืนยันรับงานออเดอร์ '+x.o.no,oid:x.oid,uid:x.uid});
  });
  Object.keys(D.orders).forEach(u=>{const m=D.orders[u],r=m.redeems||{};Object.keys(r).forEach(k=>ev.push({at:r[k].at,text:(m.name||'ลูกค้า')+' ใช้ '+r[k].pts+' แต้มแลกคูปอง '+r[k].code}))});
  return ev.sort((a,b)=>b.at-a.at).slice(0,80);
}
const unreadAdmin=()=>{const seen=Number(lsGet('kz-seen-admin')||0);return adminFeed().filter(e=>e.at>seen).length};
const pendingSlips=()=>allEntries().filter(x=>eff(x)==='review').length;
const unreadCount=()=>ID.admin&&/^a-/.test(V.name)?unreadAdmin():(ID.uid?unreadCust():0);

/* ---------- writes ---------- */
function saveMy(fn){
  return wq('orders/'+ID.uid,async()=>{
    const cur=D.my,patch=fn(cur||{}),next=merge(cur||{},patch);
    D.my=next;if(ID.admin)D.orders[ID.uid]=next;
    try{const ref=DB.doc('orders/'+ID.uid);if(cur)await ref.update(patch);else await ref.set(patch)}
    catch(e){D.my=cur;if(ID.admin){if(cur)D.orders[ID.uid]=cur;else delete D.orders[ID.uid]}throw e}
  });
}
function saveStates(u,fn){
  return wq('states/'+u,async()=>{
    const cur=D.states[u]||(u===ID.uid?D.mys:null),patch=fn(cur||{}),next=merge(cur||{},patch);
    D.states[u]=next;if(u===ID.uid)D.mys=next;
    try{const ref=DB.doc('states/'+u);if(cur)await ref.update(patch);else await ref.set(patch)}
    catch(e){if(cur){D.states[u]=cur;if(u===ID.uid)D.mys=cur}else{delete D.states[u];if(u===ID.uid)D.mys=null}throw e}
  });
}
function saveCfg(fn){
  return wq('site/config',async()=>{
    const c=clone(D.cfg)||{settings:{shopName:'KAIZEN SHOP',rate:{baht:10,points:1},contact:{},bank:{}},cats:[],pkgs:[],rewards:[]};
    c.settings=c.settings||{};c.cats=c.cats||[];c.pkgs=c.pkgs||[];c.rewards=c.rewards||[];
    const prev=D.cfg;fn(c);D.cfg=c;

async function nextNo(){
  const d=new Date(),mm=String(d.getMonth()+1).padStart(2,'0')+String(d.getFullYear()%100).padStart(2,'0');

  for(let i=0;i<8;i++){
    const r=await ref.acquire({holder,ttlMs:2000});
    if(r&&r.acquired){
      const s=await ref.get(),n=((s.exists&&s.data().n)||0)+1;
      try{await ref.update({n})}catch(e){await ref.set({n})}
      return 'ORD-'+mm+'-'+String(n).padStart(3,'0');
    }
    await sleep(700+Math.random()*700);
  }
  throw {code:'busy',message:'busy'};
}
function readImg(file,max){
  return new Promise(res=>{
    if(!file||!file.size||!/^image\//.test(file.type)){res(null);return}
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,(max||900)/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.onerror=()=>res(null);im.src=fr.result};
    fr.onerror=()=>res(null);fr.readAsDataURL(file);
  });
}
function loadImg(k){
  if(IMG[k]!=null)return Promise.resolve(IMG[k]);
  if(LOAD[k])return LOAD[k];
  const p=k.split('|');
  LOAD[k]=DB.doc('files/'+p[0]+'/imgs/'+p[1]).get().then(s=>{IMG[k]=(s.exists&&safeImg(s.data().img))||'';return IMG[k]}).catch(()=>{delete LOAD[k];return ''});
  return LOAD[k];
}
function hydrateImgs(){
  if(!DB)return;
  document.querySelectorAll('img[data-img]').forEach(im=>{loadImg(im.getAttribute('data-img')).then(v=>{if(!im.isConnected)return;if(v)im.src=v;else im.alt='ไม่พบรูป'})});
}

function lookup(no){
  no=String(no||'').trim().toUpperCase();if(!no)return null;
  const x=(ID.admin?allEntries():myEntries()).find(e=>String(e.o.no).toUpperCase()===no);

  if(x)return{no:x.o.no,status:eff(x),cat:x.o.cat,pkgName:x.o.pkgName,speed:x.o.speed||1,queueAt:(x.st&&x.st.queueAt)||(t&&t.queueAt)||0,mine:true,x};
  if(t)return{no:t.no,status:t.status,cat:t.cat,pkgName:t.pkgName,speed:t.speed||1,queueAt:t.queueAt,mine:false,updatedAt:t.updatedAt};

async function doApprove(u,oid){
  const x=entries(u).find(e=>e.oid===oid);if(!x||eff(x)!=='review')return;
  const tot=total(x);if(tot<=0){toast('กรุณากำหนดราคาสุทธิก่อนอนุมัติ');return}
  const now=Date.now(),r=ST().rate,p=Math.floor(tot/Math.max(1,r.baht))*(r.points||0);
  const old=x.st||{};
  const ok=await run(saveStates(u,cur=>{
    const o=(cur.states&&cur.states[oid])||{},patch={states:{[oid]:{status:'working',total:tot,reviewedAt:now,rejectReason:'',paidAt:now,queueAt:o.queueAt||now,pointsGiven:o.pointsGiven||p,updatedAt:now}}};
    if(!o.pointsGiven&&p>0)patch.ledger=[{id:uid(),delta:p,type:'earn',reason:'ออเดอร์ '+x.o.no,at:now,by:'ระบบ'}].concat(cur.ledger||[]).slice(0,300);
    patch.notifs=notif(cur,'สลิปออเดอร์ '+x.o.no+' ได้รับการอนุมัติ เริ่มเข้าคิวแล้ว'+(!o.pointsGiven&&p>0?' · ได้รับ '+p+' แต้ม':''));
    return patch;
  }));
  if(!ok)return;
  const x2=entries(u).find(e=>e.oid===oid)||x;
  if(!(await run(trackSet(x2,'working',{queueAt:old.queueAt||now}))))return;
  audit('อนุมัติสลิป '+x.o.no+' ('+baht(tot)+')');
  render();toast('อนุมัติแล้ว'+(p?' · เพิ่ม '+p+' แต้มให้ลูกค้า':'')+' · เข้าคิวแล้ว');
}

  status:async f=>{

  pkg:async f=>{const d=fd(f),id=f.dataset.id,o={cat:d.cat,name:d.name.trim(),price:Math.max(0,Number(d.price)||0),desc:d.desc.trim()};if(await run(saveCfg(c=>{if(id){const x=c.pkgs.find(k=>k.id===id);if(x)Object.assign(x,o)}else c.pkgs.push(Object.assign({id:uid()},o))}))){audit('บันทึกแพ็กเกจ '+o.name+' '+o.price);V.edit=null;render();toast('บันทึกแล้ว')}},
  work:async f=>{
    const d=fd(f),id=f.dataset.id,img=await readImg(f.querySelector('#w-img').files[0],800),old=D.works.find(w=>w.id===id)||{};
    const doc={title:d.title.trim(),cat:d.cat,price:Math.max(0,Number(d.price)||0),desc:d.desc.trim(),featured:!!f.querySelector('#w-feat').checked,img:img||old.img||'',date:old.date||Date.now()};
    if(await run(DB.doc('works/'+(id||uid()+uid())).set(doc))){audit('บันทึกผลงาน '+doc.title);V.edit=null;render();toast('บันทึกแล้ว')}
  },
  bank:async f=>{const d=fd(f),img=await readImg(f.querySelector('#b-qr').files[0],600);let ok=await run(saveCfg(c=>{c.settings.bank={bank:d.bank.trim(),name:d.name.trim(),no:d.no.trim(),promptpay:d.promptpay.trim()}}));if(ok&&img)ok=await run(saveMedia({qr:img}));if(ok){audit('แก้ไขข้อมูลบัญชีธนาคาร');render();toast('บันทึกแล้ว')}},
  rate:async f=>{const d=fd(f);if(await run(saveCfg(c=>{c.settings.rate={baht:Math.max(1,Number(d.baht)||10),points:Math.max(0,Number(d.points)||0)}}))){audit('ตั้งอัตราแต้ม '+d.baht+' บาท = '+d.points+' แต้ม');render();toast('บันทึกแล้ว')}},
  reward:async f=>{const d=fd(f),id=f.dataset.id,o={pts:Number(d.pts),discount:Number(d.discount)};if(await run(saveCfg(c=>{if(id){const x=c.rewards.find(k=>k.id===id);if(x)Object.assign(x,o)}else c.rewards.push(Object.assign({id:uid(),active:true},o))}))){audit('บันทึกของรางวัล '+o.pts+' แต้ม');V.edit=null;render();toast('บันทึกแล้ว')}},
  site:async f=>{const d=fd(f),img=await readImg(f.querySelector('#si-logo').files[0],256);let ok=await run(saveCfg(c=>{Object.assign(c.settings,{shopName:d.shopName.trim(),tagline:d.tagline,about:d.about,contact:{discord:d.discord.trim(),line:d.line.trim(),email:d.email.trim()}})}));if(ok&&img)ok=await run(saveMedia({logo:img}));if(ok){audit('แก้ไขตั้งค่าเว็บไซต์');render();toast('บันทึกแล้ว')}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=A[el.dataset.act];if(a){e.preventDefault();a(el,e)}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=F[f.dataset.form];if(h)h(f)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='o-cat'){V.pkg='';fillPkgs()}
  else if(t.id==='o-pkg'||t.id==='o-coupon'||t.id==='o-speed')sumUpdate();
  else if(t.dataset&&t.dataset.change==='filter')F.filter(t.form);
});
document.addEventListener('pointerdown',()=>{pdown=true});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{pdown=false}));
document.addEventListener('focusout',()=>{if(!dirty)return;setTimeout(()=>{if(dirty&&!isEditing()&&!pdown)render()},1200)});

/* ---------- boot ---------- */
function sub(key,ref,cb){
  try{ref.onSnapshot(s=>{cb(s);D.loaded[key]=1;if(!D.ready&&key==='cfg'){D.ready=true;render();return}onData()},e=>{D.err[key]=(e&&e.code)||'x';if(!D.ready){D.ready=true;render()}else onData()})}
  catch(e){D.err[key]='x'}
}
async function boot(){
  render();
  const c=window.claude;
  if(!c||typeof c.use!=='function'){D.noRuntime=true;D.ready=true;render();return}
  setTimeout(()=>{if(!D.ready){D.ready=true;render()}},4000);
  try{DB=await c.use('db')}catch(e){DB=null}
  try{UA=await c.use('user')}catch(e){UA=null}
  try{DL=await c.use('downloads')}catch(e){DL=null}
  if(UA){try{const me=await UA.me();ID.uid=me.id||null;ID.name=me.name||'';ID.admin=!!me.canEdit}catch(e){}}
  if(!DB){D.noDb=true;D.ready=true;render();return}
  sub('cfg',DB.doc('site/config'),s=>{D.cfg=s.exists?s.data():null});
  sub('media',DB.doc('site/media'),s=>{D.media=s.exists?s.data():null});
  sub('works',DB.collection('works'),s=>{D.works=s.docs.map(d=>Object.assign({id:d.id},d.data()))});
  sub('track',DB.collection('track'),s=>{D.track=s.docs.map(d=>d.data())});
  if(ID.uid){
    sub('my',DB.doc('orders/'+ID.uid),s=>{D.my=s.exists?s.data():null});
    sub('mys',DB.doc('states/'+ID.uid),s=>{D.mys=s.exists?s.data():null});
  }
  if(ID.admin){
    sub('orders',DB.collection('orders'),s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});D.orders=o});
    sub('states',DB.collection('states'),s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});D.states=o});
    sub('audit',DB.doc('site/audit'),s=>{D.audit=s.exists?s.data():null});
  }
}
boot();
})();
</script>
